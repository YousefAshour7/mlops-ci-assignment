name: MLOps Pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install torch torchvision mlflow dvc

      - name: Pull Data
        run: |
          dvc pull || true

      - name: Train Model
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python train_mlflow.py

      - name: Upload Run Info
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt

  deploy:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install mlflow

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: model-info

      - name: Check Threshold
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python check_threshold.py

      - name: Mock Deploy
        run: |
          echo "Building Docker image for Run ID: $(cat model_info.txt)"